<style>
  .collage .ph img {
  object-position: var(--img-x, 50%) var(--img-y, 50%);
}

  /* ---------- SETTINGS: edit these ---------- */
  :root {
    --block-h: 95vh;          /* height of every block; under 100vh so neighbours peek in */
    --collage-h: 170vh;       /* height of the photo collage block */
    --phones-bg: #1d2333;     /* background of the phone block */
    --phone-gap: 4vw;         /* space between the phones */
    --video-dim: 0.2;         /* video dimming: 0 = none, higher = darker (same as the landing page) */
    --lightbox-dim: 0.75;     /* darkness around the video lightbox: 0 = clear, 1 = black */
    --slide-w: 93cqw;         /* width of each slideshow slide; the rest of the width shows the next slide peeking in on the right */
  }
  /* ------------------------------------------ */

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: #111; }
  body { background: #111; font-family: "obviously-variable", Helvetica, Arial, sans-serif; font-variation-settings: "ital" 0, "wdth" 150, "wght" 300;}

  .block { position: relative; display: block; width: 100%; height: var(--block-h); overflow: hidden; background: #1a1a1a; }
  /* Category label, bottom left of every block (edit the data-category text on each <section>) */
  .block::before {
    content: attr(data-category); position: absolute; left: 2rem; bottom: 1.5rem; z-index: 3;
    color: #fff; font-size: 2rem; font-weight: 200; letter-spacing: 0.06em; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.55);
    pointer-events: none; user-select: none;
  }
  video, .collage img { display: block; width: 100%; height: 100%; object-fit: cover; background: #1a1a1a; }

  /* Dimming layer over every video (same method as the landing page) */
  .split > div, .slide, .phone { position: relative; }
  .split > div::after, .slide::after, .phone::after, .single::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: rgba(0, 0, 0, var(--video-dim));
  }

  /* Overlaid text buttons + video lightbox */
 .vid-btn {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2;
  padding: 1rem 2.25rem; border: 2px solid transparent; background: transparent; color: #fff;
  font: inherit; font-size: 2.5rem; letter-spacing: 0.04em; white-space: nowrap; cursor: pointer;
  text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 0.3em;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}

.vid-btn:hover, .vid-btn:focus-visible {
  border-color: #fff; background: #fff; color: #111; outline: none; text-decoration: none;
}

  .lightbox { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, var(--lightbox-dim)); }
  .lightbox[hidden] { display: none; }
  .lb-frame { position: relative; width: min(90vw, calc(85vh * var(--lb-num, 1.7778))); aspect-ratio: var(--lb-ratio, 16 / 9); background: #000; }
  #yt-slot { width: 100%; height: 100%; }
  .lb-frame iframe { width: 100%; height: 100%; border: 0; }
  .lightbox:focus { outline: none; }

  /* Custom controls (shown for YouTube links; the shield stops YouTube's own overlays from appearing on hover) */
  .lb-shield { position: absolute; inset: 0; z-index: 1; display: none; cursor: pointer; }
  .lb-controls {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: none; align-items: center; gap: 0.9rem;
    padding: 2.5rem 1.1rem 0.9rem; background: linear-gradient(transparent, rgba(0, 0, 0, 0.75)); color: #fff; font-size: 0.85rem;
  }
  .lightbox.custom .lb-shield { display: block; }
  .lightbox.custom .lb-controls { display: flex; }
  .lb-controls button { display: flex; padding: 0.25rem; border: 0; background: none; color: #fff; cursor: pointer; }
  .lb-controls button:hover { opacity: 0.75; }
  .lb-controls svg { width: 1.5rem; height: 1.5rem; fill: currentColor; }
  .lb-controls span { font-variant-numeric: tabular-nums; }
  .lb-seek { flex: 1; height: 0.3rem; accent-color: #fff; cursor: pointer; }
  .lb-msg { opacity: 0.85; }
  .lb-sharewrap { position: relative; display: flex; }
  .lb-menu { position: absolute; right: 0; bottom: 100%; margin-bottom: 0.6rem; min-width: 11rem; padding: 0.35rem; display: flex; flex-direction: column; border-radius: 0.6rem; background: rgba(22, 22, 26, 0.96); box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.5); }
  .lb-menu[hidden] { display: none; }
  .lightbox .lb-menu > * { display: block; padding: 0.6rem 0.8rem; border: 0; border-radius: 0.4rem; background: none; color: #fff; font: inherit; font-size: 0.9rem; text-align: left; text-decoration: none; cursor: pointer; }
  .lightbox .lb-menu > *:hover { background: rgba(255, 255, 255, 0.14); opacity: 1; }
  .lb-close { position: absolute; top: 1rem; right: 1.75rem; border: 0; background: none; color: #fff; font-size: 2.75rem; line-height: 1; cursor: pointer; }
  .lb-close:hover { opacity: 0.7; }

  /* Block type: split (two videos side by side) */
  .split { display: flex; }
  .split > div { flex: 1 1 50%; height: 100%; }

  /* Block type: slideshow */
  .track { position: relative; height: 100%; }
  .slider { container-type: inline-size; }
  .slide { position: absolute; top: 0; left: 0; width: var(--slide-w); height: 100%; transition: transform 0.5s ease; }
  .slide:not(.active) { cursor: pointer; }
  .arrow {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 3.25rem; height: 3.25rem; border-radius: 50%;
    border: 2px solid #fff; background: rgba(0, 0, 0, 0.35); color: #fff;
    font-size: 1.75rem; line-height: 1; cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .arrow:hover, .arrow:focus-visible { background: #fff; color: #111; outline: none; }
  .arrow[hidden] { display: none; }
  .arrow.prev { left: 1.5rem; }
  .arrow.next { right: 1.5rem; }

  /* Block type: three phones */
  .phones { display: flex; align-items: center; justify-content: center; gap: var(--phone-gap); background: var(--phones-bg); }
  .phone {
    --phone-h: calc(var(--block-h) * 0.78);   /* total phone height */
    --phone-b: 0.7rem;                        /* bezel thickness */
    position: relative; height: var(--phone-h);
    width: calc((var(--phone-h) - 2 * var(--phone-b)) / 1.99 + 2 * var(--phone-b));  /* screen = 9:16 video + bottom bar */
    border: var(--phone-b) solid #08090c; border-radius: 2.6rem; overflow: hidden;
    background: #08090c; box-shadow: 0 1.5rem 3rem rgba(0, 0, 0, 0.45);
    container-type: inline-size;   /* bar text scales with the phone size */
    display: flex; flex-direction: column;   /* top bar, video, bottom bar */
  }
  .phone::before {   /* notch */
    content: ""; position: absolute; top: 0.55rem; left: 50%; transform: translateX(-50%);
    width: 28%; height: 1.1rem; border-radius: 1rem; background: #08090c; z-index: 3;
  }

  /* TikTok-style: video is exactly 9:16, status bar and tabs sit on top of it, nav bar fills the rest */
  .phone video { flex: none; width: 100%; height: auto; aspect-ratio: 9 / 16; }
  .ui-top { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; position: absolute; top: 0; left: 0; right: 0; z-index: 2; color: #fff; font-weight: 600; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55); background: linear-gradient(rgba(0, 0, 0, 0.35), transparent); padding-bottom: 6cqw; pointer-events: none; }
  .status { height: 8.5cqw; display: flex; justify-content: space-between; align-items: center; padding: 0 8cqw; font-size: 0.75rem; font-size: 3.8cqw; }
  .status .right { display: flex; align-items: center; gap: 1.6cqw; }
  .batt { position: relative; width: 6.6cqw; height: 3cqw; border: 0.35cqw solid rgba(255, 255, 255, 0.7); border-radius: 0.9cqw; }
  .batt::after { content: ""; position: absolute; inset: 0.35cqw; border-radius: 0.4cqw; background: #fff; }
  .tabs { height: 10cqw; display: flex; justify-content: center; align-items: center; gap: 6cqw; font-size: 1rem; font-size: 5.2cqw; color: rgba(255, 255, 255, 0.65); }
  .tabs .on { color: #fff; border-bottom: 0.5cqw solid #fff; padding: 0.6cqw 0; }

  .ui-nav {  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; position: relative; z-index: 2; flex: 1; background: #0d0e12; color: #fff; font-weight: 600; }
  .ui-nav::after { content: ""; position: absolute; bottom: 2.5cqw; left: 50%; transform: translateX(-50%); width: 34%; height: 1.2cqw; border-radius: 1cqw; background: rgba(255, 255, 255, 0.9); }  /* home indicator */
  .ui-nav .row { height: 13.5cqw; display: flex; justify-content: space-between; align-items: center; padding: 0 5cqw; font-size: 0.85rem; font-size: 4.3cqw; color: rgba(255, 255, 255, 0.6); }
  .ui-nav .row .on { color: #fff; }
  .ui-nav .plus { width: 11.5cqw; height: 7.6cqw; border-radius: 2cqw; background: #fff; box-shadow: -1cqw 0 #25f4ee, 1cqw 0 #fe2c55; }

  /* Block type: photo collage (6 x 6 grid, no gaps) */
  .collage { height: var(--collage-h); display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(6, 1fr); }
  /* Collage editor (only active at content.html?edit) */
  .collage .ph { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  .collage.editing .ph { cursor: grab; outline: 2px solid #fff; outline-offset: -2px; touch-action: none; user-select: none; }
  .collage.editing .ph.drag { z-index: 5; opacity: 0.85; cursor: grabbing; }
  .collage .grip { display: none; position: absolute; right: 0; bottom: 0; width: 1.8rem; height: 1.8rem; background: #fff; cursor: nwse-resize; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  .collage.editing .grip { display: block; }
  .collage .cellmark { z-index: 4; pointer-events: none; }
  .collage .cellmark.gap { background: repeating-linear-gradient(45deg, rgba(255, 60, 60, 0.8) 0 6px, rgba(255, 60, 60, 0.4) 6px 12px); }
  .collage .cellmark.over { background: rgba(255, 170, 0, 0.6); }
  .editbar { position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%); z-index: 3000; display: flex; align-items: center; gap: 0.9rem; padding: 0.7rem 1rem; border-radius: 0.7rem; background: rgba(22, 22, 26, 0.96); color: #fff; font: 0.9rem "Helvetica Neue", Helvetica, Arial, sans-serif; box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.5); }
  .editbar button { padding: 0.4rem 0.9rem; border: 1px solid #fff; border-radius: 0.4rem; background: none; color: #fff; font: inherit; cursor: pointer; }
  .editbar button:hover { background: #fff; color: #111; }
  
</style>

  <script>
    // Smooth, gliding scroll (Lenis). Lower lerp = softer and slower. If the library fails to load, the page scrolls normally.
    const lenis = window.Lenis ? new Lenis({ autoRaf: true, lerp: 0.2 }) : null;

    const videos = document.querySelectorAll('video');

    // A video plays only while on screen (and, in a slideshow, only when its slide is showing)
    function update(v) {
      const slide = v.closest('.slide');
      const ok = v.dataset.vis === '1' && (!slide || slide.classList.contains('active'));
      if (ok) { v.muted = true; const p = v.play(); if (p && p.catch) p.catch(() => {}); }
      else v.pause();
    }

    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { e.target.dataset.vis = e.isIntersecting ? '1' : '0'; update(e.target); });
    }, { threshold: 0.3 });
    videos.forEach(v => { v.muted = true; io.observe(v); });

    // Slideshows
    document.querySelectorAll('.slider').forEach(s => {
      const track = s.querySelector('.track');
      const slides = [...s.querySelectorAll('.slide')];
      let i = 0;
      const loop = s.dataset.loop !== 'false';   // data-loop="false" turns looping off for a slideshow
      const prevBtn = s.querySelector('.prev'), nextBtn = s.querySelector('.next');
      function show(n, instant) {
        const len = slides.length;
        i = loop ? ((n % len) + len) % len : Math.max(0, Math.min(len - 1, n));
        prevBtn.hidden = !loop && i === 0;                 // without looping, no arrow pointing at a missing slide
        nextBtn.hidden = !loop && i === len - 1;
        slides.forEach((el, k) => {
          let off = loop ? ((k - i) % len + len) % len : k - i;
          if (loop && off > len / 2) off -= len;   // position relative to the active slide (-1 = left neighbour, 1 = right)
          const prev = el.dataset.off === undefined ? off : +el.dataset.off;
          const noAnim = instant || Math.abs(off - prev) > 1;   // a slide wrapping round jumps instead of sliding across
          if (noAnim) el.style.transition = 'none';
         const shift = s.dataset.category === 'category 5' && i === 1 ? 7 : 0;
el.style.transform = 'translateX(calc(' + (off * 100) + '% + ' + shift + 'cqw))';

          el.dataset.off = off;
          if (noAnim) { void el.offsetWidth; el.style.transition = ''; }
          el.classList.toggle('active', k === i);
          const b = el.querySelector('.vid-btn');
          if (b) b.tabIndex = k === i ? 0 : -1;
          update(el.querySelector('video'));
        });
      }
      s.querySelector('.prev').addEventListener('click', () => show(i - 1));
      s.querySelector('.next').addEventListener('click', () => show(i + 1));
      slides.forEach((el, k) => el.addEventListener('click', () => { if (k !== i) show(k); }));
      show(0, true);
    });

    // If a browser (e.g. Safari) blocks autoplay, the first click or key press starts everything
    ['pointerdown', 'keydown', 'touchstart'].forEach(evt =>
      document.addEventListener(evt, () => videos.forEach(update), { once: true, passive: true })
    );

    // Lightbox: YouTube links get custom controls (play/pause, seek bar, mute, share); other links (e.g. Vimeo) use their own player
    const lb = document.getElementById('lightbox');
    const frameBox = lb.querySelector('.lb-frame');
    const el = {
      play: lb.querySelector('.lb-play'), seek: lb.querySelector('.lb-seek'),
      cur: lb.querySelector('.lb-cur'), dur: lb.querySelector('.lb-dur'),
      mute: lb.querySelector('.lb-mute'), share: lb.querySelector('.lb-share'),
      msg: lb.querySelector('.lb-msg'), shield: lb.querySelector('.lb-shield')
    };
    const ICON = {
      play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
      pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
      vol: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>',
      muted: '<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>',
      share: '<svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>'
    };

    let player = null, ready = false, timer = null, apiPromise = null, shareLink = '', msgTimer = null;

    function parseYouTube(link) {
      try {
        const u = new URL(link), h = u.hostname.replace('www.', '');
        if (h === 'youtu.be') return u.pathname.slice(1) || null;
        if (h.endsWith('youtube.com')) {
          const p = u.pathname.split('/');
          return (p[1] === 'embed' || p[1] === 'shorts') ? (p[2] || null) : u.searchParams.get('v');
        }
      } catch (e) {}
      return null;
    }

    function toEmbed(link) {   // Vimeo falls back to its own player; anything else is embedded as given
      try {
        const u = new URL(link);
        if (u.hostname.replace('www.', '').endsWith('vimeo.com')) {
          const m = u.pathname.match(/(\d+)(?:\/(\w+))?/);
          if (m) return 'https://player.vimeo.com/video/' + m[1] + '?autoplay=1' + (m[2] ? '&h=' + m[2] : '');
        }
      } catch (e) {}
      return link;
    }

    // Direct video files (e.g. .mp4 on Cloudflare R2) play in a plain video element, driven by the same control bar
    const isFile = link => /\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(link);
    function videoAdapter(v) {
      return {
        getPlayerState: () => (v.paused ? 2 : 1),
        playVideo: () => { const p = v.play(); if (p && p.catch) p.catch(() => {}); },
        pauseVideo: () => v.pause(),
        isMuted: () => v.muted,
        mute: () => { v.muted = true; },
        unMute: () => { v.muted = false; },
        getDuration: () => v.duration || 0,
        getCurrentTime: () => v.currentTime || 0,
        seekTo: t => { v.currentTime = t; },
        destroy: () => { v.pause(); v.removeAttribute('src'); v.load(); v.remove(); }
      };
    }

    function loadApi() {
      if (apiPromise) return apiPromise;
      apiPromise = new Promise(resolve => {
        if (window.YT && YT.Player) return resolve();
        window.onYouTubeIframeAPIReady = resolve;
        const t = document.createElement('script');
        t.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(t);
      });
      return apiPromise;
    }

    const fmt = t => { t = Math.floor(t || 0); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };

    function tick() {
      if (!player || !ready) return;
      const d = player.getDuration() || 0, c = player.getCurrentTime() || 0;
      el.seek.max = d; el.seek.value = c;
      el.cur.textContent = fmt(c); el.dur.textContent = fmt(d);
    }
    function syncIcons() {
      const playing = ready && player.getPlayerState() === 1;
      el.play.innerHTML = playing ? ICON.pause : ICON.play;
      el.mute.innerHTML = (ready && player.isMuted()) ? ICON.muted : ICON.vol;
    }
    function togglePlay() {
      if (!ready) return;
      if (player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo();
    }
    function toggleMute() {
      if (!ready) return;
      if (player.isMuted()) player.unMute(); else player.mute();
      syncIcons();
    }
    function flash(text) {
      el.msg.textContent = text;
      clearTimeout(msgTimer);
      msgTimer = setTimeout(() => { el.msg.textContent = ''; }, 1800);
    }

    async function openLightbox(link, slug) {
      const id = parseYouTube(link);
      // Tidy share link: this page plus a short name, e.g. yoursite.com/content.html#project-one
      const pageLink = slug ? location.href.split('#')[0] + '#' + slug : '';
      if (slug) { try { history.replaceState(null, '', '#' + slug); } catch (e) {} }
      lb.hidden = false;
      document.body.style.overflow = 'hidden';
      if (lenis) lenis.stop();
      lb.focus();

      frameBox.querySelectorAll('#yt-slot, iframe').forEach(n => n.remove());
      const slot = document.createElement('div');
      slot.id = 'yt-slot';
      frameBox.prepend(slot);

      if (!id && isFile(link)) {   // direct video file: plain <video> with the custom controls
        lb.classList.add('custom');
        shareLink = pageLink || new URL(link, location.href).href;
        el.seek.value = 0; el.cur.textContent = '0:00'; el.dur.textContent = '0:00';
        const v = document.createElement('video');
        v.playsInline = true;
        v.preload = 'auto';
        v.style.cssText = 'display:block;width:100%;height:100%;object-fit:contain;background:#000';
        v.src = link;
        slot.appendChild(v);
        v.addEventListener('loadedmetadata', () => {
          if (v.videoWidth && v.videoHeight) {
            frameBox.style.setProperty('--lb-num', v.videoWidth / v.videoHeight);
            frameBox.style.setProperty('--lb-ratio', v.videoWidth + ' / ' + v.videoHeight);
          }
        });        
        player = videoAdapter(v);
        ready = true;
        ['play', 'pause', 'volumechange', 'loadedmetadata', 'ended'].forEach(ev =>
          v.addEventListener(ev, () => { syncIcons(); tick(); }));
        timer = setInterval(tick, 250);
        syncIcons();
        player.playVideo();   // runs inside the click, so the browser allows sound
        return;
      }

      if (!id) {   // not YouTube: use the host's own player and controls
        lb.classList.remove('custom');
        frameBox.style.removeProperty('--lb-num'); frameBox.style.removeProperty('--lb-ratio');
        const f = document.createElement('iframe');
        f.allow = 'autoplay; fullscreen; picture-in-picture';
        f.allowFullscreen = true;
        f.src = toEmbed(link);
        slot.appendChild(f);
        return;
      }

      lb.classList.add('custom');
      shareLink = pageLink || 'https://youtu.be/' + id;
      ready = false;
      el.seek.value = 0; el.cur.textContent = '0:00'; el.dur.textContent = '0:00';
      syncIcons();

      await loadApi();
      if (lb.hidden) return;   // closed while the API was loading
      player = new YT.Player('yt-slot', {
        videoId: id,
        playerVars: { autoplay: 1, controls: 0, rel: 0, iv_load_policy: 3, playsinline: 1, disablekb: 1, fs: 0, enablejsapi: 1 },
        events: {
          onReady: e => { ready = true; e.target.playVideo(); syncIcons(); tick(); },
          onStateChange: () => { syncIcons(); tick(); }
        }
      });
      timer = setInterval(tick, 250);
    }

    function closeLightbox() {
      lb.hidden = true;
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
      menu.hidden = true;
      clearInterval(timer);
      ready = false;
      if (player) { try { player.destroy(); } catch (e) {} player = null; }
      frameBox.querySelectorAll('#yt-slot, iframe').forEach(n => n.remove());
      lb.classList.remove('custom');
      document.body.style.overflow = '';
      if (lenis) lenis.start();
    }

    el.share.innerHTML = ICON.share;
    syncIcons();
    el.play.addEventListener('click', togglePlay);
    el.shield.addEventListener('click', togglePlay);
    el.mute.addEventListener('click', toggleMute);
    el.seek.addEventListener('input', () => {
      if (!ready) return;
      player.seekTo(parseFloat(el.seek.value), true);
      el.cur.textContent = fmt(el.seek.value);
    });
    const menu = lb.querySelector('.lb-menu');
    function copyLink() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareLink).then(() => flash('Link copied'), () => window.prompt('Copy this link', shareLink));
      } else window.prompt('Copy this link', shareLink);
    }
    el.share.addEventListener('click', () => {
      const u = encodeURIComponent(shareLink);
      menu.querySelector('[data-act="email"]').href = 'mailto:?subject=' + encodeURIComponent('Check out this video') + '&body=' + u;
      menu.querySelector('[data-act="whatsapp"]').href = 'https://wa.me/?text=' + u;
      menu.querySelector('[data-act="x"]').href = 'https://twitter.com/intent/tweet?url=' + u;
      menu.querySelector('[data-act="facebook"]').href = 'https://www.facebook.com/sharer/sharer.php?u=' + u;
      menu.hidden = !menu.hidden;
    });
    menu.addEventListener('click', e => {
      const item = e.target.closest('[data-act]');
      if (!item) return;
      if (item.dataset.act === 'copy') copyLink();
      if (item.dataset.act === 'native') navigator.share({ url: shareLink }).catch(() => {});
      menu.hidden = true;
    });
    if (!navigator.share) menu.querySelector('[data-act="native"]').remove();   // only shown where the system share sheet exists
    document.addEventListener('click', e => { if (!e.target.closest('.lb-sharewrap')) menu.hidden = true; });

    // Each button's short name comes from its text (or from an optional data-id), e.g. "project one" -> "project-one"
    const slugOf = b => (b.dataset.id || b.textContent).trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const buttons = [...document.querySelectorAll('.vid-btn')];
    buttons.forEach(b => b.addEventListener('click', () => openLightbox(b.dataset.video, slugOf(b))));

    // Opening a shared link (content.html#project-one) opens that video straight away
    const wanted = decodeURIComponent(location.hash.slice(1));
    const target = wanted && buttons.find(b => slugOf(b) === wanted);
    if (target) openLightbox(target.dataset.video, wanted);
    lb.querySelector('.lb-close').addEventListener('click', closeLightbox);
    lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', e => {
      if (lb.hidden) return;
      if (e.key === 'Escape') { if (!menu.hidden) menu.hidden = true; else closeLightbox(); }
      else if (lb.classList.contains('custom') && !['BUTTON', 'INPUT'].includes(document.activeElement.tagName)) {
        if (e.key === ' ') { e.preventDefault(); togglePlay(); }
        else if (e.key === 'm' || e.key === 'M') toggleMute();
      }
    });

    // ---- Collage layout editor: open content.html?edit to move and resize photos ----
(function () {
  const grid = document.querySelector('.collage');
  if (!grid || !/[?&]edit\b/.test(location.search)) return;
  const COLS = 7, ROWS = 6;
  const photos = [...grid.querySelectorAll('.ph')];
  const KEY = 'collageLayout:' + location.pathname;

  const bar = document.createElement('div');
  bar.className = 'editbar';
  bar.innerHTML = '<span>Drag a photo to move its frame; drag its corner to resize. Hold Alt/Option and drag a photo to reposition its crop.</span><b class="st"></b>' +
    '<button data-a="copy">Copy layout</button><button data-a="reset">Reset</button><button data-a="exit">Exit</button>';
  document.body.appendChild(bar);
  const stat = bar.querySelector('.st');

  const apply = (el, s) => {
    el.style.gridArea = s.r + ' / ' + s.c + ' / ' + (s.r + s.rs) + ' / ' + (s.c + s.cs);
    el.style.setProperty('--img-x', s.x + '%');
    el.style.setProperty('--img-y', s.y + '%');
  };

  const state = photos.map(el => {
    const m = el.style.gridArea.split('/').map(n => parseInt(n, 10));
    return { r: m[0], c: m[1], rs: m[2] - m[0], cs: m[3] - m[1], x: parseFloat(el.style.getPropertyValue('--img-x')) || 50,
y: parseFloat(el.style.getPropertyValue('--img-y')) || 50
};
  });

  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && saved.length === state.length) {
      saved.forEach((s, k) => { state[k] = { ...state[k], ...s }; });
    }
  } catch (e) {}

  grid.classList.add('editing');
  photos.forEach((el, k) => {
    const grip = document.createElement('i');
    grip.className = 'grip';
    el.appendChild(grip);
    el.querySelector('img').draggable = false;
    apply(el, state[k]);
  });

  // Shade empty cells (red) and doubled-up cells (orange).
  let marks = [];
  function refresh() {
    marks.forEach(m => m.remove());
    marks = [];
    const used = Array.from({ length: ROWS }, () => new Array(COLS).fill(0));

    state.forEach(s => {
      for (let r = s.r; r < s.r + s.rs; r++) {
        for (let c = s.c; c < s.c + s.cs; c++) {
          used[r - 1][c - 1]++;
        }
      }
    });

    let gaps = 0, overlaps = 0;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const n = used[r][c];
        if (n === 1) continue;

        const mark = document.createElement('div');
        mark.className = 'cellmark ' + (n === 0 ? 'gap' : 'over');
        mark.style.gridArea = (r + 1) + ' / ' + (c + 1) + ' / ' + (r + 2) + ' / ' + (c + 2);
        grid.appendChild(mark);
        marks.push(mark);

        if (n === 0) gaps++;
        else overlaps++;
      }
    }

    stat.textContent = (gaps || overlaps)
      ? gaps + ' empty, ' + overlaps + ' overlapping'
      : 'No gaps or overlaps';
    stat.style.color = (gaps || overlaps) ? '#ffb46b' : '#7dffa8';

    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {}
  }

  refresh();

  let drag = null;

  grid.addEventListener('pointerdown', e => {
    const el = e.target.closest('.ph');
    if (!el) return;

    const k = photos.indexOf(el);
    const img = e.target.closest('img');

    // Alt/Option-drag an image to adjust its crop within the frame.
    if (img && e.altKey) {
      const rect = img.getBoundingClientRect();
      drag = {
        mode: 'image',
        k,
        el,
        img,
        startX: e.clientX,
        startY: e.clientY,
        width: rect.width,
        height: rect.height,
        x: state[k].x,
        y: state[k].y
      };
      el.classList.add('drag');
      el.setPointerCapture(e.pointerId);
      e.preventDefault();
      return;
    }

    const rect = grid.getBoundingClientRect();
    const cw = rect.width / COLS;
    const ch = rect.height / ROWS;
    const cx = Math.floor((e.clientX - rect.left) / cw);
    const cy = Math.floor((e.clientY - rect.top) / ch);

    drag = {
      mode: 'frame',
      k,
      el,
      rect,
      cw,
      ch,
      resize: e.target.classList.contains('grip'),
      dc: cx - (state[k].c - 1),
      dr: cy - (state[k].r - 1)
    };

    el.classList.add('drag');
    el.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  grid.addEventListener('pointermove', e => {
    if (!drag) return;

    const s = state[drag.k];

    if (drag.mode === 'image') {
      s.x = Math.max(0, Math.min(100,
        drag.x - (e.clientX - drag.startX) / drag.width * 100));
      s.y = Math.max(0, Math.min(100,
        drag.y - (e.clientY - drag.startY) / drag.height * 100));
      apply(drag.el, s);
      refresh();
      return;
    }

    const cx = Math.floor((e.clientX - drag.rect.left) / drag.cw);
    const cy = Math.floor((e.clientY - drag.rect.top) / drag.ch);

    if (drag.resize) {
      s.cs = Math.max(1, Math.min(COLS - s.c + 1, cx - (s.c - 1) + 1));
      s.rs = Math.max(1, Math.min(ROWS - s.r + 1, cy - (s.r - 1) + 1));
    } else {
      s.c = Math.max(1, Math.min(COLS - s.cs + 1, cx - drag.dc + 1));
      s.r = Math.max(1, Math.min(ROWS - s.rs + 1, cy - drag.dr + 1));
    }

    apply(drag.el, s);
    refresh();
  });

  const endDrag = () => {
    if (drag) {
      drag.el.classList.remove('drag');
      drag = null;
    }
  };

  grid.addEventListener('pointerup', endDrag);
  grid.addEventListener('pointercancel', endDrag);

  bar.addEventListener('click', e => {
    const action = e.target.dataset.a;

    if (action === 'copy') {
      const code = photos.map((el, k) => {
  const img = el.querySelector('img');
  const s = state[k];
  return '    <div class="ph" style="grid-area: ' + el.style.gridArea +
    '; --img-x: ' + s.x + '%; --img-y: ' + s.y + '%">' +
    '<img src="' + img.getAttribute('src') + '" alt=""></div>';
}).join('\n');


      const done = () => alert('Layout copied. In content.html, replace the photo lines inside the collage block with it.');

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(
          done,
          () => window.prompt('Copy this layout', code)
        );
      } else {
        window.prompt('Copy this layout', code);
      }
    } else if (action === 'reset') {
      try {
        localStorage.removeItem(KEY);
      } catch (err) {}
      location.reload();
    } else if (action === 'exit') {
      location.href = location.pathname;
    }
  });

  grid.scrollIntoView();
})();

  </script>
